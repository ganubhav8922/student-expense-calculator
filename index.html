<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibe‑Coded Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>🎨 Vibe‑Coded Expense Calculator</h1>
        <div class="form-card">
            <input type="text" id="expenseName" placeholder="Expense name">
            <input type="number" id="expenseAmount" placeholder="Amount (₹)" step="0.01">
            <select id="expenseCategory">
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Supplies">Supplies</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>
            <button id="addBtn">Add Expense</button>
            <button id="clearAllBtn" class="clear-btn">Clear All</button>
        </div>
        <div class="filter-area">
            <label>Filter category:</label>
            <select id="filterCategory">
                <option value="all">All</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Supplies">Supplies</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>
        </div>
        <div class="stats">
            <h3>Total Spent: ₹<span id="total">0.00</span></h3>
            <canvas id="chart" width="400" height="200"></canvas>
        </div>
        <div class="expense-list">
            <h3>Expenses</h3>
            <ul id="expenseList"></ul>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
